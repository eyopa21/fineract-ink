# Fintech Fineract assessment stack. FOR LOCAL ASSESSMENT USE ONLY.
# One command: `docker compose up -d --wait` (or `make up`).
#
# Services
#   postgres             single Postgres 18.3 with four databases (see docker/postgres/init.sh)
#   fineract             Apache Fineract 1.15.0 built from source with the Part A patch applied
#   mock-erp             Python/FastAPI mock ERP (chart of accounts, journal entries)
#   integration-service  Python/FastAPI integration API (partner-facing)
#
# Host ports: INTEGRATION_PORT (8100), MOCK_ERP_PORT (8101), FINERACT_PORT (8080); override via environment or .env.
# Passwords are fixed and committed on purpose: this stack never leaves a laptop.

name: fineract-assessment

x-db-passwords: &db-passwords
  FINERACT_DB_PASSWORD: fineract
  ERP_DB_PASSWORD: erp
  INTEGRATION_DB_PASSWORD: integration

services:
  postgres:
    image: postgres:18.3
    environment:
      <<: *db-passwords
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - pgdata:/var/lib/postgresql
    # Host port intentionally not published; use `docker compose exec postgres psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  fineract:
    image: ${FINERACT_IMAGE:-fineract-custom:1.15.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FINERACT_NODE_ID: "1"
      # Plain HTTP inside the stack; TLS is a documented non-goal for a local assessment.
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_SERVER_PORT: "8080"
      # Tenant store (fineract_tenants)
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://postgres:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: fineract
      FINERACT_HIKARI_PASSWORD: fineract
      FINERACT_HIKARI_MINIMUM_IDLE: "3"
      FINERACT_HIKARI_MAXIMUM_POOL_SIZE: "10"
      FINERACT_HIKARI_TEST_QUERY: SELECT 1
      FINERACT_HIKARI_AUTO_COMMIT: "true"
      # Default tenant (fineract_default), created and migrated by Fineract at boot
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: postgres
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: fineract
      FINERACT_DEFAULT_TENANTDB_PWD: fineract
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: Assessment tenant
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Africa/Kigali
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
    ports:
      - "${FINERACT_PORT:-8080}:8080"
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/fineract-provider/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 120s

  mock-erp:
    build: ./mock-erp
    image: fineract-assessment/mock-erp:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://erp:erp@postgres:5432/erp
      LOG_LEVEL: INFO
    ports:
      - "${MOCK_ERP_PORT:-8101}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  integration-service:
    build: ./integration-service
    image: fineract-assessment/integration-service:local
    depends_on:
      postgres:
        condition: service_healthy
      fineract:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://integration:integration@postgres:5432/integration
      FINERACT_BASE_URL: http://fineract:8080/fineract-provider/api/v1
      FINERACT_TENANT_ID: default
      # Bootstrap admin; the Part B setup replaces it with a least-privilege API user.
      FINERACT_USERNAME: mifos
      FINERACT_PASSWORD: password
      ERP_BASE_URL: http://mock-erp:8000
      API_KEY: partner-demo-key
      LOG_LEVEL: INFO
    ports:
      - "${INTEGRATION_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
